name: The Pass
version: "0.2.2"
slug: the_pass
description: Scan-only kitchen-island task loop. Cards (4x6 labels) are projects, receipt slips are tasks.
url: https://github.com/thathimbo/the-pass-addons
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8787
panel_icon: mdi:silverware-fork-knife
panel_title: The Pass
panel_admin: false
ports:
  8787/tcp: 8787
  9101/tcp: 9101
ports_description:
  8787/tcp: Projector page, scanner page, retro form (phones), and the HTTP API
  9101/tcp: Raw label jobs (CUPS raster / PNG) printed through The Pass's label path
webui: http://[HOST]:[PORT:8787]/
watchdog: http://[HOST]:[PORT:8787]/api/health
# Label printer (Polono PL80E, USB). usblp exposes it as /dev/usb/lp0 on HA OS.
# Missing paths are ignored by Supervisor and picked up on hot-plug.
usb: true
devices:
  - /dev/usb/lp0
  - /dev/usb/lp1
map:
  - type: share
    read_only: false
backup_exclude:
  - "*.png"
options:
  receipt_printer: escpos
  receipt_host: 192.168.1.87
  receipt_port: 9100
  receipt_cut: partial
  label_printer: tspl_usb
  label_device: /dev/usb/lp0
  label_density: 8
  label_speed: 3
  label_gap_mm: 3
  label_invert: false
  label_band_rows: 200
  label_thin: 0.5
  label_raw_port: 9101
  cups_server: 172.30.32.1:631
  base_url: http://192.168.1.92:8787
  webhooks: []
  mid_task: note
  out_keep: 3000
schema:
  receipt_printer: list(escpos|png)
  receipt_host: str?
  receipt_port: port
  receipt_cut: list(partial|full|none)
  label_printer: list(tspl_usb|cups|png)
  label_device: str
  label_density: int(0,15)
  label_speed: int(1,10)
  label_gap_mm: float(0,10)
  label_invert: bool
  label_band_rows: int(0,1200)
  label_thin: float(0,1)
  label_raw_port: int(0,65535)?
  cups_queue: str?
  cups_server: str?
  base_url: str?
  token: password?
  webhooks:
    - url
  mid_task: list(note|allow)
  out_keep: int(0,)
